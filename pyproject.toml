[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SSTVFlow"
version = "0.1.1"
description = "SSTVFlow: an automatic streaming Robot36 and PD120 SSTV decoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "soundfile>=0.12"]
benchmark = ["psutil>=5.9"]

[project.scripts]
decoder = "sstv_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
